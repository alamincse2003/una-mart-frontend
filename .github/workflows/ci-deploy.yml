# CI on every push and pull request; deploy to the VPS on pushes to main.
#
#   test   → lint, type-check, production build
#   image  → build the Docker image, push to ghcr.io (main only)
#   deploy → run deploy.sh web <sha> on the server (main only)
#
# The server files (compose, Caddy, deploy.sh) live in una-mart-backend/deploy.
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_API_URL   https://api.unamart.online/v1
#   NEXT_PUBLIC_SITE_URL  https://www.unamart.online
#   NEXT_PUBLIC_APP_ENV   staging   (empty for the public shop)
#   DEPLOY_ENABLED        true      (after the server is set up)
# Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/una-mart-web

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The build must not need a running API (storefront pages render per request).
      NEXT_PUBLIC_API_URL: https://api.unamart.online/v1
      NEXT_PUBLIC_SITE_URL: https://www.unamart.online
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_ENV=${{ vars.NEXT_PUBLIC_APP_ENV }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy storefront
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: /opt/unamart/deploy.sh web ${{ github.sha }}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U&Zen — Premium Fashion, Sports & Tech</title>
<meta name="description" content="U&Zen — a premium demo e-commerce experience blending fashion, sports and technology.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0F172A;
  --white:#FFFFFF;
  --accent:#F97316;
  --accent-dark:#C2410C;
  --bg:#F8FAFC;
  --text:#1E293B;
  --text-soft:#64748B;
  --success:#22C55E;
  --sale:#EF4444;
  --warning:#F59E0B;
  --border:#E2E8F0;
  --glow:rgba(249,115,22,0.22);
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.font-display{font-family:'Outfit',sans-serif;}
a{color:inherit; text-decoration:none;}
img{display:block; max-width:100%;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--glow); color:var(--navy);}

/* ---------- layout helpers ---------- */
.wrap{max-width:1320px; margin:0 auto; padding:0 24px;}
.section{padding:72px 0;}
@media(max-width:768px){.section{padding:44px 0;} .wrap{padding:0 18px;}}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:32px; gap:16px; flex-wrap:wrap;}
.section-title{font-size:32px; font-weight:700; color:var(--navy); letter-spacing:-.02em;}
.section-sub{color:var(--text-soft); font-size:15px; margin-top:6px;}
.view-all{font-weight:600; font-size:14px; color:var(--navy); display:flex; align-items:center; gap:6px; white-space:nowrap; border-bottom:2px solid var(--navy); padding-bottom:2px; transition:.2s;}
.view-all:hover{color:var(--accent); border-color:var(--accent);}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 28px; border-radius:100px; font-weight:600; font-size:14.5px; transition:.25s cubic-bezier(.4,0,.2,1); white-space:nowrap;}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--accent); box-shadow:0 8px 24px var(--glow); transform:translateY(-2px);}
.btn-outline{background:transparent; color:var(--navy); border:1.5px solid var(--navy);}
.btn-outline:hover{background:var(--navy); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-accent:hover{background:var(--accent-dark); box-shadow:0 8px 24px var(--glow); transform:translateY(-2px);}
.btn-ghost-white{background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.5); backdrop-filter:blur(8px);}
.btn-ghost-white:hover{background:#fff; color:var(--navy);}
.btn-sm{padding:9px 18px; font-size:13px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

/* ---------- header ---------- */
#site-header{position:sticky; top:0; z-index:100; background:rgba(248,250,252,.75); backdrop-filter:blur(14px) saturate(160%); border-bottom:1px solid var(--border); transition:.3s;}
.header-top{display:flex; align-items:center; gap:28px; padding:16px 0;}
.logo{font-size:24px; font-weight:800; letter-spacing:-.03em; color:var(--navy); display:flex; align-items:center; gap:2px; flex-shrink:0;}
.logo span{color:var(--accent);}
.search-shell{flex:1; max-width:480px; position:relative; display:flex; align-items:center; background:#fff; border:1.5px solid var(--border); border-radius:100px; padding:0 8px 0 18px; transition:.2s;}
.search-shell:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--glow);}
.search-shell input{flex:1; border:none; outline:none; padding:11px 8px; font-size:14px; background:transparent;}
.search-shell button{background:var(--navy); color:#fff; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.header-icons{display:flex; align-items:center; gap:6px; margin-left:auto;}
.icon-btn{position:relative; width:42px; height:42px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--navy); transition:.2s;}
.icon-btn:hover{background:#fff; box-shadow:0 4px 14px rgba(15,23,42,.08);}
.icon-badge{position:absolute; top:2px; right:2px; background:var(--sale); color:#fff; font-size:10px; font-weight:700; width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.header-nav{display:flex; align-items:center; gap:2px; padding:6px 0 14px; overflow-x:auto;}
.header-nav a{padding:9px 16px; border-radius:100px; font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; transition:.2s;}
.header-nav a:hover, .header-nav a.active{background:var(--navy); color:#fff;}
.header-nav a.sale-link{color:var(--sale);}
.header-nav a.sale-link:hover{background:var(--sale); color:#fff;}
.mobile-only{display:none;}
@media(max-width:900px){
  .search-shell{display:none;}
  .header-nav{display:none;}
  .mobile-only{display:flex;}
}

/* ---------- hero ---------- */
.hero{position:relative; min-height:600px; display:flex; align-items:center; overflow:hidden; background:var(--navy); color:#fff; border-radius:0 0 32px 32px;}
.hero-bg{position:absolute; inset:0; background-size:cover; background-position:center;}
.hero-content{position:relative; z-index:2; padding:100px 24px; max-width:1320px; margin:0 auto; width:100%;}
.hero-eyebrow{display:inline-flex; align-items:center; gap:8px; background:rgba(249,115,22,.18); border:1px solid rgba(249,115,22,.4); color:#fdba74; padding:7px 16px; border-radius:100px; font-size:12.5px; font-weight:600; letter-spacing:.04em; margin-bottom:24px;}
.hero-title{font-size:clamp(38px,6vw,68px); font-weight:800; line-height:1.03; letter-spacing:-.03em; max-width:780px; animation:riseIn .8s cubic-bezier(.16,1,.3,1) both;}
.hero-title em{font-style:normal; color:var(--accent);}
.hero-desc{font-size:18px; color:#cbd5e1; max-width:520px; margin:22px 0 34px; animation:riseIn .8s .1s cubic-bezier(.16,1,.3,1) both;}
.hero-cta{display:flex; gap:14px; flex-wrap:wrap; animation:riseIn .8s .2s cubic-bezier(.16,1,.3,1) both;}
@keyframes riseIn{from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);}}
.hero-stats{display:flex; gap:40px; margin-top:56px; animation:riseIn .8s .3s cubic-bezier(.16,1,.3,1) both;}
.hero-stats div b{font-size:26px; font-weight:800; display:block;}
.hero-stats div span{font-size:12.5px; color:#94a3b8;}

/* ---------- marquee ---------- */
.marquee-strip{background:var(--navy); color:#fff; overflow:hidden; padding:12px 0; white-space:nowrap;}
.marquee-track{display:inline-flex; animation:scroll 26s linear infinite;}
.marquee-track span{padding:0 32px; font-size:13px; font-weight:600; letter-spacing:.03em; color:#cbd5e1;}
.marquee-track span b{color:var(--accent);}
@keyframes scroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}

/* ---------- category cards ---------- */
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
@media(max-width:900px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
/* ---------- filter bar (category pages) ---------- */
.filter-bar{display:flex; gap:12px; margin-bottom:26px; flex-wrap:wrap; align-items:center;}
.filter-pills{display:flex; gap:8px; flex-wrap:wrap;}
.filter-sort{padding:9px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:13px; font-weight:600; color:var(--navy); background:#fff; outline:none;}
/* ---------- currency selector ---------- */
.currency-select{border:1.5px solid var(--border); border-radius:100px; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--navy); background:#fff; outline:none; cursor:pointer;}
/* ---------- modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(15,23,42,.6); backdrop-filter:blur(3px); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-box{background:#fff; border-radius:20px; max-width:520px; width:100%; max-height:86vh; overflow-y:auto; padding:28px;}
.modal-box .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-box .modal-head h3{font-size:19px; font-weight:700; color:var(--navy);}
.cat-card{position:relative; border-radius:var(--radius); overflow:hidden; aspect-ratio:3/4; cursor:pointer; box-shadow:0 4px 18px rgba(15,23,42,.06);}
.cat-card img{width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.16,1,.3,1);}
.cat-card:hover img{transform:scale(1.08);}
.cat-overlay{position:absolute; inset:0; background:linear-gradient(0deg, rgba(15,23,42,.85) 0%, rgba(15,23,42,.05) 55%);}
.cat-info{position:absolute; left:0; right:0; bottom:0; padding:20px; color:#fff;}
.cat-info h3{font-size:19px; font-weight:700;}
.cat-info .explore{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:#cbd5e1; margin-top:6px; opacity:0; transform:translateY(6px); transition:.3s;}
.cat-card:hover .explore{opacity:1; transform:translateY(0);}

/* ---------- product cards ---------- */
.prod-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
@media(max-width:1024px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:768px){.prod-grid{grid-template-columns:repeat(2,1fr); gap:14px;}}
.prod-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:.3s cubic-bezier(.4,0,.2,1); position:relative; display:flex; flex-direction:column;}
.prod-card:hover{transform:translateY(-6px); box-shadow:0 20px 40px rgba(15,23,42,.10); border-color:transparent;}
.prod-media{position:relative; aspect-ratio:1/1.12; overflow:hidden; background:#eef2f7; cursor:pointer;}
.prod-media img{width:100%; height:100%; object-fit:cover; transition:transform .5s ease;}
.prod-card:hover .prod-media img{transform:scale(1.06);}
.prod-badge{position:absolute; top:12px; left:12px; padding:5px 11px; border-radius:100px; font-size:11px; font-weight:700; letter-spacing:.03em; z-index:2;}
.badge-new{background:var(--navy); color:#fff;}
.badge-sale{background:var(--sale); color:#fff;}
.badge-best{background:var(--warning); color:#fff;}
.prod-wish{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; z-index:2; transition:.2s;}
.prod-wish:hover{background:#fff; transform:scale(1.1);}
.prod-wish.active svg{fill:var(--sale); stroke:var(--sale);}
.prod-quick{position:absolute; left:12px; right:12px; bottom:-50px; background:var(--navy); color:#fff; text-align:center; padding:11px; border-radius:10px; font-size:13px; font-weight:600; transition:.3s cubic-bezier(.4,0,.2,1); z-index:2;}
.prod-card:hover .prod-quick{bottom:12px;}
.prod-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:6px; flex:1;}
.prod-cat{font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
.prod-title{font-size:14.5px; font-weight:600; color:var(--navy); line-height:1.35;}
.prod-rating{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-soft);}
.stars{color:var(--warning); letter-spacing:1px; font-size:12px;}
.prod-price-row{display:flex; align-items:center; gap:8px; margin-top:4px;}
.price-now{font-size:16.5px; font-weight:800; color:var(--navy);}
.price-old{font-size:13px; color:var(--text-soft); text-decoration:line-through;}
.price-off{font-size:11.5px; font-weight:700; color:var(--sale);}
.prod-actions{display:flex; gap:8px; margin-top:10px;}
.prod-actions .btn{flex:1; padding:10px 14px; font-size:13px;}

/* ---------- promo / deals ---------- */
.deal-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
@media(max-width:900px){.deal-grid{grid-template-columns:1fr;}}
.deal-card{border-radius:var(--radius); padding:32px; min-height:220px; position:relative; overflow:hidden; color:#fff; display:flex; flex-direction:column; justify-content:space-between;}
.deal-card.d1{background:linear-gradient(135deg,#0F172A,#1e3a5f);}
.deal-card.d2{background:linear-gradient(135deg,#EF4444,#b91c1c);}
.deal-card.d3{background:linear-gradient(135deg,#F97316,#9a3412);}
.deal-pct{font-size:52px; font-weight:800; letter-spacing:-.03em;}
.deal-card img{position:absolute; right:-10px; bottom:-10px; width:150px; opacity:.9; border-radius:12px;}

/* ---------- feature banner (fashion/sports/tech blocks) ---------- */
.feat-banner{border-radius:24px; overflow:hidden; position:relative; min-height:340px; display:flex; align-items:center; margin-bottom:28px;}
.feat-banner .bg{position:absolute; inset:0; object-fit:cover; width:100%; height:100%;}
.feat-banner .scrim{position:absolute; inset:0; background:linear-gradient(90deg, rgba(15,23,42,.92) 32%, rgba(15,23,42,.15));}
.feat-banner .fb-content{position:relative; z-index:2; padding:48px; color:#fff; max-width:460px;}
.feat-banner h3{font-size:34px; font-weight:800; margin-bottom:10px;}
.feat-banner p{color:#cbd5e1; margin-bottom:22px; font-size:15px;}

/* ---------- reviews ---------- */
.review-track{display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:12px;}
.review-track::-webkit-scrollbar{height:6px;}
.review-track::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
.review-card{scroll-snap-align:start; flex:0 0 340px; background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:26px;}
.review-top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.review-avatar{width:46px; height:46px; border-radius:50%; object-fit:cover;}
.review-name{font-weight:700; font-size:14.5px; color:var(--navy);}
.review-role{font-size:12px; color:var(--text-soft);}
.review-text{font-size:14px; color:var(--text-soft); line-height:1.6;}

/* ---------- newsletter ---------- */
.newsletter{background:var(--navy); border-radius:28px; padding:64px 40px; text-align:center; color:#fff; position:relative; overflow:hidden;}
.newsletter::before{content:''; position:absolute; width:400px; height:400px; background:radial-gradient(circle, var(--glow), transparent 70%); top:-150px; right:-100px;}
.newsletter h2{font-size:32px; font-weight:800; margin-bottom:10px;}
.newsletter p{color:#94a3b8; margin-bottom:28px;}
.newsletter-form{display:flex; max-width:440px; margin:0 auto; gap:10px; position:relative; z-index:2;}
.newsletter-form input{flex:1; padding:15px 20px; border-radius:100px; border:none; outline:none; font-size:14px;}

/* ---------- footer ---------- */
footer{background:#0B1220; color:#94a3b8; padding:64px 0 26px; margin-top:40px;}
.footer-grid{display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1.3fr; gap:32px;}
@media(max-width:900px){.footer-grid{grid-template-columns:repeat(2,1fr);}}
footer h4{color:#fff; font-size:14.5px; font-weight:700; margin-bottom:16px;}
footer ul{list-style:none;}
footer li{margin-bottom:10px; font-size:13.5px;}
footer a:hover{color:#fff;}
.foot-social{display:flex; gap:10px; margin-top:16px;}
.foot-social a{width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center;}
.foot-social a:hover{background:var(--accent);}
.foot-bottom{border-top:1px solid rgba(255,255,255,.08); margin-top:48px; padding-top:24px; display:flex; justify-content:space-between; font-size:12.5px; flex-wrap:wrap; gap:10px;}
.pay-icons{display:flex; gap:8px;}
.pay-icons span{background:rgba(255,255,255,.08); padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; color:#cbd5e1;}

/* ---------- generic card / badges ---------- */
.card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:24px;}
.pill{display:inline-block; padding:4px 12px; border-radius:100px; font-size:11.5px; font-weight:700;}
.pill-success{background:#dcfce7; color:#15803d;}
.pill-warning{background:#fef3c7; color:#b45309;}
.pill-sale{background:#fee2e2; color:#b91c1c;}
.pill-info{background:#dbeafe; color:#1d4ed8;}
.pill-muted{background:#f1f5f9; color:#64748b;}

/* ---------- breadcrumb ---------- */
.crumbs{font-size:13px; color:var(--text-soft); margin-bottom:22px;}
.crumbs a:hover{color:var(--accent);}

/* ---------- product detail page ---------- */
.pd-grid{display:grid; grid-template-columns:1fr 1fr; gap:56px;}
@media(max-width:900px){.pd-grid{grid-template-columns:1fr; gap:28px;}}
.pd-main-img{border-radius:20px; overflow:hidden; aspect-ratio:1/1; background:#eef2f7; cursor:zoom-in; position:relative;}
.pd-main-img img{width:100%; height:100%; object-fit:cover; transition:transform .3s;}
.pd-thumbs{display:flex; gap:12px; margin-top:14px;}
.pd-thumb{width:76px; height:76px; border-radius:10px; overflow:hidden; border:2px solid transparent; cursor:pointer; opacity:.7;}
.pd-thumb.active{border-color:var(--accent); opacity:1;}
.pd-thumb img{width:100%; height:100%; object-fit:cover;}
.swatch-row{display:flex; gap:10px; flex-wrap:wrap;}
.size-swatch{min-width:44px; height:44px; padding:0 12px; border:1.5px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:600; transition:.2s;}
.size-swatch:hover{border-color:var(--navy);}
.size-swatch.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.color-swatch{width:34px; height:34px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--border); cursor:pointer;}
.color-swatch.active{box-shadow:0 0 0 2px var(--navy);}
.qty-stepper{display:flex; align-items:center; border:1.5px solid var(--border); border-radius:100px; overflow:hidden; width:fit-content;}
.qty-stepper button{width:38px; height:38px; font-size:17px; font-weight:600; color:var(--navy);}
.qty-stepper button:hover{background:var(--bg);}
.qty-stepper span{width:36px; text-align:center; font-weight:700;}
.pd-tabs{display:flex; gap:28px; border-bottom:1px solid var(--border); margin:36px 0 20px;}
.pd-tab{padding:12px 2px; font-weight:600; font-size:14.5px; color:var(--text-soft); border-bottom:2px solid transparent; transition:.2s;}
.pd-tab.active{color:var(--navy); border-color:var(--accent);}

/* ---------- cart / checkout ---------- */
.cart-row{display:grid; grid-template-columns:90px 1fr auto auto auto; gap:16px; align-items:center; padding:18px 0; border-bottom:1px solid var(--border);}
@media(max-width:640px){.cart-row{grid-template-columns:70px 1fr; row-gap:10px;}}
.cart-row img{width:90px; height:90px; object-fit:cover; border-radius:12px;}
@media(max-width:640px){.cart-row img{width:70px; height:70px;}}
.summary-row{display:flex; justify-content:space-between; font-size:14.5px; padding:9px 0; color:var(--text-soft);}
.summary-row.total{font-size:18px; font-weight:800; color:var(--navy); border-top:1px solid var(--border); margin-top:8px; padding-top:16px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field label{font-size:13px; font-weight:600; color:var(--navy); margin-bottom:6px; display:block;}
.field input,.field select,.field textarea{width:100%; padding:13px 16px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; outline:none; transition:.2s; background:#fff;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--glow);}
.pay-option{display:flex; align-items:center; gap:12px; border:1.5px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; transition:.2s;}
.pay-option.active{border-color:var(--accent); background:#eff6ff;}

/* ---------- account ---------- */
.acct-shell{display:grid; grid-template-columns:260px 1fr; gap:32px;}
@media(max-width:800px){.acct-shell{grid-template-columns:1fr;}}
.acct-nav a{display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:12px; font-size:14.5px; font-weight:600; color:var(--text-soft); margin-bottom:4px; transition:.2s;}
.acct-nav a:hover{background:#fff; color:var(--navy);}
.acct-nav a.active{background:var(--navy); color:#fff;}

/* ---------- badges general ---------- */
.stat-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* ---------- admin ---------- */
#admin-app{display:flex; min-height:100vh; background:#F1F5F9;}
.admin-sidebar{width:260px; background:var(--navy); color:#cbd5e1; flex-shrink:0; padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.admin-logo{color:#fff; font-size:20px; font-weight:800; padding:10px 12px 26px; display:flex; align-items:center; gap:2px;}
.admin-logo span{color:var(--accent);}
.admin-nav a{display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; font-size:13.5px; font-weight:600; margin-bottom:2px; transition:.18s; color:#94a3b8;}
.admin-nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
.admin-nav a.active{background:var(--accent); color:#fff;}
.admin-nav .grp-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#475569; padding:16px 14px 6px; font-weight:700;}
.admin-main{flex:1; min-width:0;}
.admin-topbar{background:#fff; border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10;}
.admin-content{padding:28px;}
.stat-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:14px;}
.stat-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:16px;}
@media(max-width:1400px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-val{font-size:24px; font-weight:800; color:var(--navy);}
.stat-label{font-size:12.5px; color:var(--text-soft); font-weight:600;}
.stat-delta{font-size:12px; font-weight:700;}
.admin-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.admin-table th{text-align:left; padding:12px 14px; background:#F8FAFC; color:var(--text-soft); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border);}
.admin-table td{padding:14px; border-bottom:1px solid var(--border); color:var(--text);}
.admin-table tr:hover td{background:#F8FAFC;}
.admin-card{background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden;}
.admin-card-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.admin-card-head h3{font-size:16px; font-weight:700; color:var(--navy);}
.chip-btn{padding:7px 14px; border-radius:100px; font-size:12.5px; font-weight:600; border:1.5px solid var(--border); color:var(--text-soft); transition:.2s;}
.chip-btn.active,.chip-btn:hover{background:var(--navy); color:#fff; border-color:var(--navy);}
.admin-search{display:flex; align-items:center; gap:8px; border:1.5px solid var(--border); border-radius:10px; padding:9px 14px; background:#F8FAFC;}
.admin-search input{border:none; background:transparent; outline:none; font-size:13.5px; width:180px;}
.progress-bar{height:7px; border-radius:10px; background:#F1F5F9; overflow:hidden;}
.progress-fill{height:100%; border-radius:10px; background:var(--accent);}
.avatar-sm{width:34px; height:34px; border-radius:50%; object-fit:cover;}
.action-icon{width:32px; height:32px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--text-soft); transition:.2s;}
.action-icon:hover{background:#F1F5F9; color:var(--navy);}

/* ---------- login screens ---------- */
.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); position:relative; overflow:hidden; padding:24px;}
.login-shell::before{content:''; position:absolute; width:600px; height:600px; background:radial-gradient(circle, var(--glow), transparent 70%); top:-200px; left:-150px;}
.login-shell::after{content:''; position:absolute; width:500px; height:500px; background:radial-gradient(circle, rgba(249,115,22,.14), transparent 70%); bottom:-200px; right:-150px;}
.login-card{position:relative; z-index:2; background:rgba(255,255,255,.06); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:24px; padding:44px; width:100%; max-width:420px; color:#fff;}
.login-card input{width:100%; padding:14px 18px; border-radius:10px; border:1.5px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:#fff; outline:none; font-size:14px; margin-bottom:14px;}
.login-card input:focus{border-color:var(--accent);}
.login-card input::placeholder{color:#64748b;}

/* ---------- toast ---------- */
#toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(120%); background:var(--navy); color:#fff; padding:14px 24px; border-radius:100px; font-size:14px; font-weight:600; z-index:999; transition:.35s cubic-bezier(.16,1,.3,1); display:flex; align-items:center; gap:10px; box-shadow:0 12px 30px rgba(0,0,0,.25);}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ---------- toggle switch (delivery charge on/off, etc.) ---------- */
.toggle-switch{position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0;}
.toggle-switch input{opacity:0; width:0; height:0; position:absolute;}
.toggle-track{position:absolute; inset:0; background:#CBD5E1; border-radius:100px; transition:.25s; cursor:pointer;}
.toggle-track::before{content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.25s cubic-bezier(.4,0,.2,1); box-shadow:0 1px 3px rgba(15,23,42,.25);}
.toggle-switch input:checked + .toggle-track{background:var(--success);}
.toggle-switch input:checked + .toggle-track::before{transform:translateX(20px);}
.toggle-row{display:flex; align-items:center; gap:12px;}
.toggle-state-label{font-weight:700; font-size:13px; padding:3px 10px; border-radius:100px; background:#f1f5f9; color:var(--text-soft);}
.toggle-state-label.on{background:#dcfce7; color:#15803d;}

/* ---------- utility ---------- */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
@media(max-width:800px){.grid-2{grid-template-columns:1fr;}}
.flex-c{display:flex; align-items:center;}
.text-soft{color:var(--text-soft);}
.mb-8{margin-bottom:8px;} .mb-16{margin-bottom:16px;} .mb-24{margin-bottom:24px;}
.reveal{opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);}
.reveal.in{opacity:1; transform:translateY(0);}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:#cbd5e1; border-radius:10px;}
.empty-state{text-align:center; padding:80px 20px;}
.empty-state svg{margin:0 auto 20px;}
@media print{#site-header,footer{display:none;}}
</style>
</head>

/* All product prices are stored in USD as the base unit. CURRENCY_RATES convert
   from USD to the selected display currency. Display amounts always round UP
   (ceiling) to the nearest whole unit — never rounded down, per store policy. */
const CURRENCY_RATES = { BDT:110, USD:1, EUR:0.92, GBP:0.79 };
const CURRENCY_SYMBOLS = { BDT:'৳', USD:'$', EUR:'€', GBP:'£' };
function cartCount(){ return state.cart.reduce((a,c)=>a+c.qty,0); }
function cartTotal(){ return state.cart.reduce((a,c)=>{const p=byId(c.id); const price=p.discount||p.price; return a+price*c.qty;},0); }
/* Delivery charge is skipped only when EVERY item in the cart has "free delivery" turned on for that product */
function cartAllFreeDelivery(){
  return state.cart.length>0 && state.cart.every(c=>{ const p=byId(c.id); return p && p.freeDelivery; });
}
function fmt(nUsd){
  const rate = CURRENCY_RATES[state.currency] || 1;
  const converted = Number(nUsd) * rate;
  if(state.currency==='BDT'){
    /* BDT always shows a whole number, rounded up — 49.2 becomes 50, never a decimal */
    return CURRENCY_SYMBOLS.BDT + Math.ceil(converted).toLocaleString('en-US');
  }
  /* every other currency shows the real converted amount with decimals */
  return CURRENCY_SYMBOLS[state.currency] + converted.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function bdtToUsd(bdt){ return Number(bdt) / CURRENCY_RATES.BDT; }
function shippingChargeBDT(district){
  const isInsideDhaka = district === 'Dhaka';
  return isInsideDhaka ? state.deliveryCharges.insideDhakaBDT : state.deliveryCharges.outsideDhakaBDT;
}
function shippingChargeUsd(district){ return bdtToUsd(shippingChargeBDT(district)); }
function setCurrency(c){ state.currency = c; render(); }
function stars(r){ const full=Math.round(r); return '★'.repeat(full)+'☆'.repeat(5-full); }

function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* -------- category listing with gender / season / search / sort filters -------- */
function getCategoryBaseList(catId){
  if(!catId) return PRODUCTS;
  return PRODUCTS.filter(p=>p.cats.includes(catId));
}
function computeCategoryList(){
  const f = state.catFilters;
  let list = getCategoryBaseList(state.catId);
  if(f.gender && f.gender!=='all'){
    list = list.filter(p=>{
      if(f.gender==='kids') return p.genders.includes('kids');
      return p.genders.includes(f.gender) || p.genders.includes('unisex');
    });
  }
  if(f.season && f.season!=='all') list = list.filter(p=>p.season===f.season || p.season==='all');
  if(f.q) list = list.filter(p=>p.title.toLowerCase().includes(f.q.toLowerCase()) || p.sub.toLowerCase().includes(f.q.toLowerCase()));
  if(f.sort==='price-asc') list = [...list].sort((a,b)=>(a.discount||a.price)-(b.discount||b.price));
  else if(f.sort==='price-desc') list = [...list].sort((a,b)=>(b.discount||b.price)-(a.discount||a.price));
  return list;
}

function setCatFilter(key,val){
  state.catFilters[key]=val;
  if(key==='q'){

    if(list.length===0 && grid) grid.innerHTML = emptyState('No products found','Try a different filter or search term.');

function setPay(k){ state.payMethod=k; render(); }
function onDivisionChange(division){
  const districtSelect = document.getElementById('district-select');
  const upazilaField = document.getElementById('upazila-field');
  const upazilaSelect = document.getElementById('upazila-select');
  if(!districtSelect) return;
  upazilaField.style.display='none';
  if(upazilaSelect){ upazilaSelect.innerHTML='<option value="">Select upazila</option>'; upazilaSelect.required=false; }
  state.checkoutDistrict = null;
  if(!division || !DELIVERY_ZONES[division]){
    districtSelect.innerHTML = '<option value="">Select division first</option>';
    districtSelect.disabled = true;
    updateCheckoutTotals();
    return;
  }
  districtSelect.disabled = false;
  /* List every district in the division directly — no A/B/C letter grouping */
  const districts = DELIVERY_ZONES[division];
  districtSelect.innerHTML = '<option value="">Select district</option>' +
    districts.map(([name])=>`<option value="${name}">${name}</option>`).join('');
  updateCheckoutTotals();
}
function onDistrictChange(district){
  const upazilaField = document.getElementById('upazila-field');
  const upazilaSelect = document.getElementById('upazila-select');
  const division = document.getElementById('division-select').value;
  if(!upazilaField || !upazilaSelect) return;
  if(!district || !DELIVERY_ZONES[division]){
    upazilaField.style.display='none';
    upazilaSelect.required=false;
    state.checkoutDistrict = null;
    updateCheckoutTotals();
    return;
  }
  const found = DELIVERY_ZONES[division].find(([name])=>name===district);
  const upazilas = found ? found[1] : [];
  upazilaSelect.innerHTML = '<option value="">Select upazila</option>' + upazilas.map(u=>`<option value="${u}">${u}</option>`).join('');
  upazilaSelect.required = true;
  upazilaField.style.display='block';
  state.checkoutDistrict = district;
  updateCheckoutTotals();
}
function updateCheckoutTotals(){
  const subtotal = cartTotal();
  const discount = state.coupon ? subtotal*0.1 : 0;
  const district = state.checkoutDistrict;
  const allFree = cartAllFreeDelivery();
  const shipping = (!allFree && district) ? shippingChargeUsd(district) : 0;
  const total = subtotal-discount+shipping;
  const shipEl = document.getElementById('checkout-shipping');
  const totalEl = document.getElementById('checkout-total');
  const btnEl = document.getElementById('place-order-btn');
  const noteEl = document.getElementById('shipping-note');
  if(shipEl) shipEl.textContent = allFree ? 'Free' : (district ? fmt(shipping) : 'Select district');
  if(totalEl) totalEl.textContent = fmt(total);
  if(btnEl) btnEl.textContent = `Place Order — ${fmt(total)}`;
  if(noteEl) noteEl.textContent = allFree
    ? 'Every item in your cart has free delivery — no delivery charge will be added.'
    : (district ? `Delivery charge: ${fmt(shipping)} (${district==='Dhaka'?'Inside Dhaka':'Outside Dhaka'})` : 'Select your district to calculate the delivery charge.');
}
function placeOrder(){
  state.cart=[]; state.coupon=null; state.checkoutDistrict=null;
  go('order-success');
}

function addToCart(id,qty,size,color){
  const p=byId(id);
  size = size||p.sizes[0]; color = color||p.colors[0];
  const existing = state.cart.find(c=>c.id===id && c.size===size && c.color===color);
  if(existing) existing.qty+=qty; else state.cart.push({id,qty,size,color});
  toast(`${p.title} added to cart`);
  renderHeaderBadges();
}
function updateQty(id,size,d){
  const it = state.cart.find(c=>c.id===id && c.size===size);
  if(!it) return;
  it.qty=Math.max(1,it.qty+d);
  render();
}
function removeFromCart(id,size){
  state.cart = state.cart.filter(c=>!(c.id===id && c.size===size));
  render();
}
function applyCoupon(){
  const v = document.getElementById('coupon-input').value.trim().toUpperCase();
  if(['WELCOME10','SUMMER50','FREESHIP'].includes(v)){ state.coupon=v; toast('Coupon applied!'); }
  else toast('Invalid or expired coupon');
  render();
}
function toggleWishlist(id){
  if(state.wishlist.includes(id)) state.wishlist=state.wishlist.filter(x=>x!==id);
  else { state.wishlist.push(id); toast('Added to wishlist'); }
  render();
}

========================================================= */
function go(path){ location.hash = '#/'+path; }
function doSearch(){
  const v = document.getElementById('global-search')?.value || '';
  go('search/'+encodeURIComponent(v));
}
function toggleMobileNav(){
  const nav=document.getElementById('header-nav');
  nav.style.display = nav.style.display==='flex' ? 'none':'flex';
  nav.style.flexDirection='column'; nav.style.alignItems='flex-start';
}

function render(){
  const hash = location.hash.replace(/^#\//,'') || '';
  const parts = hash.split('/').filter(Boolean);
  const root = parts[0]||'home';
  let html='';

  if(root==='' || root==='home'){ html = pageHome(); }
  else if(root==='category'){
    const cat = parts[1];
    const catMeta = CATEGORIES.find(c=>c.id===cat) || {id:cat, name:cat?cat[0].toUpperCase()+cat.slice(1):'Shop'};
    if(state.catId !== cat){ state.catFilters = {gender:'all', season:'all', sort:'featured', q:''}; }
    state.catId = cat;
    html = pageCategory(cat, catMeta);
  }
  else if(root==='new-arrivals'){ const list=PRODUCTS.filter(p=>p.badge==='new').concat(PRODUCTS.slice(0,10)); window._currentGridList=list; html=pageProductGrid('New Arrivals','Fresh drops, straight off the line.',list,'New Arrivals'); }
  else if(root==='sale'){ const list=PRODUCTS.filter(p=>p.discount); window._currentGridList=list; html=pageProductGrid('Sale','Up to 50% off selected styles.',list,'Sale'); }
  else if(root==='product'){ html = pageProduct(parts[1]); }
  else if(root==='cart'){ html = pageCart(); }
  else if(root==='checkout'){ html = pageCheckout(); }
  else if(root==='order-success'){ html = pageOrderSuccess(); }
  else if(root==='account'){ html = pageAccount(parts[1]); }
  else if(root==='search'){ html = pageSearch(decodeURIComponent(parts[1]||'')); }
  else if(root==='page'){
    const map={
      about:['About Us','U&Zen was founded on a simple idea: that fashion, sport and technology shouldn\'t live in separate wardrobes. We design considered, durable pieces for a life in motion — sourced responsibly, tested rigorously, and priced fairly. This is a demo storefront built to showcase a premium shopping experience.'],
      contact:['Contact','Email us at hello@uzen-demo.com or call +880 1234-567890. Our support team is available Sunday–Thursday, 9am–6pm.'],
      careers:['Careers','We\'re not currently hiring — this is a demo page. In a live version, open roles across design, engineering and retail would appear here.'],
      stores:['Store Locator','U&Zen flagship stores are located in Dhaka, Chattogram and Sylhet. Store details are placeholder content for this demo.'],
      faq:['FAQ','<b>How long does delivery take?</b> 3–5 business days within Dhaka, 5–8 days nationwide.<br><br><b>Can I return an item?</b> Yes, within 30 days of delivery in original condition.<br><br><b>Do you ship internationally?</b> Currently we ship within Bangladesh only for this demo.'],
      shipping:['Shipping Info','Delivery charge is 70 BDT inside Dhaka and 130 BDT outside Dhaka. Standard delivery takes 3–8 business days depending on location.'],
      returns:['Returns','Items may be returned within 30 days of delivery for a full refund, provided they are unworn and in original packaging.'],
      privacy:['Privacy Policy','This is placeholder legal text for demo purposes. In production this page would detail how U&Zen collects, uses and protects customer data.'],
      terms:['Terms & Conditions','This is placeholder legal text for demo purposes outlining the terms of use for the U&Zen storefront.'],
      cookies:['Cookie Policy','This is placeholder legal text describing cookie usage for demo purposes.'],
    };
    const m = map[parts[1]] || ['Page','Content coming soon.'];
    html = pageStaticText(m[0],m[1]);
  }
  else if(root==='admin'){ html = renderAdmin(parts.slice(1)); }
  else { html = pageNotFound(); }

  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
  initScrollReveal();
  if(root==='category'||root==='new-arrivals'||root==='sale'||root==='search'){} // grid list already set
}
window.addEventListener('hashchange', render);

function initScrollReveal(){
  document.querySelectorAll('.section').forEach(el=>el.classList.add('reveal'));
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

function filterAdminProducts(q){

function toggleProductDelivery(id){

function removeAdminProduct(id){

function onNewProductCatChange(){
  const checked = Array.from(document.querySelectorAll('.np-cat-cb:checked')).map(cb=>cb.value);
  const showGender = checked.includes('fashion') || checked.includes('accessories');
  const showSeason = checked.includes('fashion');
  document.getElementById('np-gender-field').style.display = showGender ? 'block' : 'none';
  document.getElementById('np-season-field').style.display = showSeason ? 'block' : 'none';
  refreshProductPreview();
}
function onNewProductSizeToggle(size){
  const cb = document.querySelector(`.np-size-cb[value="${size}"]`);
  const qtyInput = document.getElementById('np-size-qty-'+size);
  qtyInput.disabled = !cb.checked;
  if(cb.checked && !qtyInput.value) qtyInput.value = 10;
  if(!cb.checked) qtyInput.value = '';
  refreshProductPreview();
}
function onNewProductDeliveryToggle(){
  const checked = document.getElementById('np-delivery').checked;
  const label = document.getElementById('np-delivery-state');
  if(label){
    label.textContent = checked ? 'ON' : 'OFF';
    label.classList.toggle('on', checked);
  }
  refreshProductPreview();
}
function onNewProductImages(e){
  const files = Array.from(e.target.files).slice(0,4);
  npUploadedImages = [];
  const preview = document.getElementById('np-image-preview');
  preview.innerHTML = '';
  if(files.length===0){ refreshProductPreview(); return; }
  let loaded = 0;
  files.forEach((file,i)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      npUploadedImages[i] = ev.target.result;
      loaded++;
      const img = document.createElement('img');
      img.src = ev.target.result;
      img.style.cssText = 'width:56px;height:56px;object-fit:cover;border-radius:8px;border:1.5px solid var(--border);';
      preview.appendChild(img);
      if(loaded===files.length) refreshProductPreview();
    };
    reader.readAsDataURL(file);
  });
}
function collectNewProductSizes(){
  const sizes = [];
  const sizeStock = {};
  SIZES.forEach(s=>{
    const cb = document.querySelector(`.np-size-cb[value="${s}"]`);
    const qtyInput = document.getElementById('np-size-qty-'+s);
    if(cb && cb.checked){
      const qty = parseInt(qtyInput.value,10) || 0;
      sizes.push(s);
      sizeStock[s] = qty;
    }
  });
  return {sizes, sizeStock};
}
function refreshProductPreview(){
  const preview = document.getElementById('np-preview');
  if(!preview) return;
  const title = document.getElementById('np-title')?.value || 'Product Title';
  const priceBDT = parseFloat(document.getElementById('np-price')?.value) || 0;
  const discountRawBDT = document.getElementById('np-discount')?.value;
  const discountBDT = discountRawBDT ? parseFloat(discountRawBDT) : null;
  const price = bdtToUsd(priceBDT);
  const badge = document.getElementById('np-badge')?.value || '';
  const cats = Array.from(document.querySelectorAll('.np-cat-cb:checked')).map(cb=>cb.value);
  const genders = Array.from(document.querySelectorAll('.np-gender-cb:checked')).map(cb=>cb.value);
  const season = document.getElementById('np-season')?.value;
  const freeDelivery = document.getElementById('np-delivery')?.checked;
  const {sizes} = collectNewProductSizes();
  const validDiscount = (discountBDT && discountBDT<priceBDT) ? bdtToUsd(discountBDT) : null;
  const off = validDiscount ? Math.round(100-(validDiscount/price*100)) : 0;
  const img = npUploadedImages[0] || IMG('preview-placeholder',700,860);
  const genderLabel = genders.length ? genders.map(g=>GENDER_LABEL[g]).join('/') : '';
  const catLabel = cats.length ? cats.map(c=>c[0].toUpperCase()+c.slice(1)).join(', ') : 'No category selected';
  preview.innerHTML = `
  <div class="prod-card" style="max-width:260px;">
    <div class="prod-media">
      ${badge==='new'?`<span class="prod-badge badge-new">NEW</span>`:''}
      ${badge==='sale'&&off?`<span class="prod-badge badge-sale">-${off}%</span>`:''}
      ${badge==='best'?`<span class="prod-badge badge-best">BESTSELLER</span>`:''}
      <img src="${img}" alt="preview">
    </div>
    <div class="prod-body">
      <div class="prod-cat">${catLabel}${genderLabel?' · '+genderLabel:''}</div>
      <div class="prod-title">${title}</div>
      <div class="text-soft" style="font-size:11.5px;">${season&&season!=='all'?season[0].toUpperCase()+season.slice(1):''}</div>
      <div class="prod-price-row">
        <span class="price-now">${fmt(validDiscount||price)}</span>
        ${validDiscount?`<span class="price-old">${fmt(price)}</span><span class="price-off">-${off}%</span>`:''}
      </div>
      ${freeDelivery?`<div style="font-size:11px; font-weight:700; color:var(--success);">Free Delivery</div>`:''}
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
        ${sizes.length? sizes.map(s=>`<span class="pill pill-muted">${s}</span>`).join('') : '<span class="text-soft" style="font-size:11.5px;">No sizes added yet</span>'}
      </div>
    </div>
  </div>`;
}
function submitAddProduct(){
  const title = document.getElementById('np-title').value.trim();
  const descInput = document.getElementById('np-desc').value.trim();
  const priceBDT = parseFloat(document.getElementById('np-price').value);
  const discountRawBDT = document.getElementById('np-discount').value;
  const discountBDT = discountRawBDT ? parseFloat(discountRawBDT) : null;
  const badge = document.getElementById('np-badge').value || null;
  const freeDelivery = document.getElementById('np-delivery').checked;
  const cats = Array.from(document.querySelectorAll('.np-cat-cb:checked')).map(cb=>cb.value);
  const genders = Array.from(document.querySelectorAll('.np-gender-cb:checked')).map(cb=>cb.value);
  const seasonField = document.getElementById('np-season-field');
  const season = (seasonField && seasonField.style.display!=='none') ? document.getElementById('np-season').value : 'all';
  const {sizes, sizeStock} = collectNewProductSizes();

  if(!title || isNaN(priceBDT)){ toast('Please fill in title and price'); return; }
  if(cats.length===0){ toast('Please select at least one category'); return; }
  if(sizes.length===0){ toast('Please tick at least one size and enter its stock'); return; }

  /* BDT is always rounded up to a whole taka first — every other currency (and
     the internal USD-equivalent base price) is then derived from that rounded value */
  const roundedPriceBDT = Math.ceil(priceBDT);
  const roundedDiscountBDT = (discountBDT && discountBDT<priceBDT) ? Math.ceil(discountBDT) : null;
  const price = bdtToUsd(roundedPriceBDT);
  const discount = roundedDiscountBDT ? bdtToUsd(roundedDiscountBDT) : null;

  const finalGenders = genders.length ? genders : ['unisex'];
  const stock = sizes.reduce((a,s)=>a+(sizeStock[s]||0),0);
  const id = 'P'+(2000+PRODUCTS.length);
  const seed = 'uzen-new'+PRODUCTS.length+'-'+Date.now();
  const images = npUploadedImages.filter(Boolean).length
    ? npUploadedImages.filter(Boolean)
    : [IMG(seed+'a',700,860),IMG(seed+'b',700,860),IMG(seed+'c',700,860),IMG(seed+'d',700,860)];
  const sub = cats.map(c=>c[0].toUpperCase()+c.slice(1)).join(' / ');

  const newProduct = {
    id, title, sub,
    cats, cat: cats[0],
    genders: finalGenders, gender: finalGenders[0],
    badge, season,
    price, discount,
    rating:'4.5', reviews:0, stock,
    sizes, sizeStock,
    colors: COLORS.slice(0,3),
    images,
    desc: descInput || `The ${title} blends considered design with everyday performance. Cut from premium materials and finished with U&Zen's signature minimal hardware, it's built to move with you — from the studio to the street.`,
    freeDelivery,
  };
  PRODUCTS.push(newProduct);
  npUploadedImages = [];
  closeModal();
  toast(`${title} added to ${cats.map(c=>c[0].toUpperCase()+c.slice(1)).join(', ')}`);
  render();
}

  return `
  <div class="grid-2 mb-24">
    <div class="card">
      <h3 style="font-weight:700; margin-bottom:16px;">Store Settings</h3>
      <div class="field mb-16"><label>Store Name</label><input value="U&Zen"></div>
      <div class="field mb-16"><label>Support Email</label><input value="hello@uzen-demo.com"></div>
      <div class="field mb-16"><label>Default Storefront Currency</label>
        <select id="admin-currency-select">${Object.keys(CURRENCY_RATES).map(c=>`<option value="${c}" ${state.currency===c?'selected':''}>${c}</option>`).join('')}</select>
        <p class="text-soft" style="font-size:12px; margin-top:6px;">Prices always round up to the nearest whole unit — never down.</p>
      </div>
      <button class="btn btn-primary" onclick="setCurrency(document.getElementById('admin-currency-select').value); toast('Settings saved')">Save Changes</button>
    </div>
    <div class="card">
      <h3 style="font-weight:700; margin-bottom:16px;">Admin Password</h3>
      <div class="field mb-16"><label>Current Password</label><input type="password" placeholder="••••••••"></div>
      <div class="field mb-16"><label>New Password</label><input type="password" placeholder="New password"></div>
      <button class="btn btn-outline" onclick="toast('Password updated (demo)')">Update Password</button>
    </div>
  </div>
  <div class="card mb-24">
    <h3 style="font-weight:700; margin-bottom:6px;">Delivery Charges</h3>
    <p class="text-soft" style="font-size:13px; margin-bottom:16px;">Set the flat delivery charge (in BDT) applied at checkout based on the customer's selected district. "Inside Dhaka" applies when the customer selects the Dhaka district; every other district uses the outside-Dhaka charge.</p>
    <div class="form-grid">
      <div class="field"><label>Inside Dhaka (BDT)</label><input type="number" min="0" step="1" id="delivery-inside" value="${state.deliveryCharges.insideDhakaBDT}"></div>
      <div class="field"><label>Outside Dhaka (BDT)</label><input type="number" min="0" step="1" id="delivery-outside" value="${state.deliveryCharges.outsideDhakaBDT}"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="saveDeliveryCharges()">Save Delivery Charges</button>
  </div>
  <div class="card">
    <h3 style="font-weight:700; margin-bottom:6px;">Size Chart</h3>
    <p class="text-soft" style="font-size:13px; margin-bottom:16px;">Edit the Length and Chest measurements (inches) shown to customers on every product's Size Guide.</p>
    <div style="overflow-x:auto;"><table class="admin-table"><thead><tr><th>Size</th><th>Length (in)</th><th>Chest (in)</th></tr></thead><tbody>
      ${SIZES.map(s=>`<tr>
        <td style="font-weight:700; color:var(--navy);">${s}</td>
        <td><input type="number" step="0.1" id="chart-${s}-length" value="${state.sizeChart[s].length}" style="width:90px; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px;"></td>
        <td><input type="number" step="0.1" id="chart-${s}-chest" value="${state.sizeChart[s].chest}" style="width:90px; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px;"></td>
      </tr>`).join('')}
    </tbody></table></div>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="saveSizeChart()">Save Size Chart</button>
  </div>`;
}
function saveDeliveryCharges(){
  const inside = parseFloat(document.getElementById('delivery-inside').value);
  const outside = parseFloat(document.getElementById('delivery-outside').value);
  if(!isNaN(inside) && inside>=0) state.deliveryCharges.insideDhakaBDT = inside;
  if(!isNaN(outside) && outside>=0) state.deliveryCharges.outsideDhakaBDT = outside;
  toast('Delivery charges updated');
}
function saveSizeChart(){
  SIZES.forEach(s=>{
    const len = parseFloat(document.getElementById(`chart-${s}-length`).value);
    const chest = parseFloat(document.getElementById(`chart-${s}-chest`).value);
    state.sizeChart[s] = { length: isNaN(len)?state.sizeChart[s].length:len, chest: isNaN(chest)?state.sizeChart[s].chest:chest };
  });
  toast('Size chart updated');
}

/* =========================================================
   INIT
========================================================= */
render();
</script>
</body>
</html>
